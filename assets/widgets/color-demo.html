<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>body{margin:0;display:grid;place-content:center;justify-items:center;gap:15px;height:100vh;font:18px sans-serif;background:#f4faf8;color:#224640}#shape{width:90px;height:90px;background:#398f87;border-radius:50%;transition:background .3s}button{font:inherit;padding:10px 20px;background:white;border:1px solid #b1cec7;border-radius:8px}</style><div id="shape"></div><button id="switch">切换颜色</button><script>let orange=false;document.getElementById('switch').onclick=()=>{orange=!orange;document.getElementById('shape').style.background=orange?'#d39a48':'#398f87'};</script></html>
